<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GitHome{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">GitHome</a>
    <nav>
      {% if user %}
        <form class="searchbar" action="/search" method="get">
          <input type="search" name="q" placeholder="Rechercher dans mon code..." value="{{ query if query is defined else '' }}">
        </form>
        <span class="muted">{{ user["username"] }}</span>
        <a href="/logout">Deconnexion</a>
      {% else %}
        <a href="/login">Connexion</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
